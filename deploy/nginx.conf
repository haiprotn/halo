# Nginx đứng trước uvicorn.
#
# GIAI ĐOẠN 1 — máy còn trong LAN, chưa có IP tĩnh công cộng:
#   để nguyên `server_name _;`, vào bằng http://192.168.1.10/
#   UFW đã mở 80 nên không phải thêm luật.
#
# GIAI ĐOẠN 2 — sau khi dọn sang phòng máy chủ và có IP tĩnh:
#   đổi server_name thành halo.tenmien.vn, trỏ bản ghi A, rồi:
#     sudo certbot --nginx -d halo.tenmien.vn
#   (hạ TTL bản ghi A xuống 300s vài ngày TRƯỚC khi chuyển máy)

server {
    listen 80;
    server_name _;

    # Ảnh banner có thể vài trăm KB; để 8m cho thoải mái
    client_max_body_size 8m;

    access_log /var/log/nginx/halo-access.log;
    error_log  /var/log/nginx/halo-error.log;

    location / {
        # Cổng 8081 chứ không phải 8080: trên máy này đã có một tiến trình Python
        # nghe 0.0.0.0:8080 chưa truy ra nguồn gốc (ghi trong claude/may-chu-tai-cho.md).
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Bắt buộc: ứng dụng đọc IP thật từ header này để ghi nhật ký
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # đẩy SFTP nhiều ảnh có thể lâu
    }

    location /khoe {
        proxy_pass http://127.0.0.1:8081/khoe;
        access_log off;
    }
}
